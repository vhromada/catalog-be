services:
  postgres:
    image: 'postgres:18.7'
    environment:
      - 'POSTGRES_DB=catalog'
      - 'POSTGRES_PASSWORD=catalog'
      - 'POSTGRES_USER=catalog'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
  catalog:
    depends_on:
      - postgres
    image: 'catalog-be:26.6'
    ports:
      - '8100:8080'
    build:
      context: .
    environment:
      - CATALOG_SECURITY_USERNAME=catalog
      - CATALOG_SECURITY_PASSWORD=catalog
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/catalog
      - SPRING_DATASOURCE_USERNAME=catalog
      - SPRING_DATASOURCE_PASSWORD=catalog
volumes:
  pgdata:
